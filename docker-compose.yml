services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: captus
      POSTGRES_PASSWORD: captus
      POSTGRES_DB: captus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captus -d captus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./src/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://captus:captus@db:5432/captus
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build: ./src/frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
