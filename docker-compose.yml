services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: captus
      POSTGRES_PASSWORD: captus
      POSTGRES_DB: captus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captus -d captus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./src/backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./src/backend/.env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - ./data:/data:ro
      - ./playbook:/app/playbook:ro
      - ./legacy_neo4j_kb.json:/app/legacy_neo4j_kb.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build: ./src/frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules

volumes:
  pgdata:
